version = 1

[[agents]]
kind = "pi"
process_name_patterns = ["pi"]
launch_command_hints = ["pi"]
osc_title_patterns = ["Pi"]

[[agents]]
kind = "claude"
process_name_patterns = ["claude", "claude-code"]
launch_command_hints = ["claude", "claude-code"]
osc_title_patterns = ["Claude Code", "Claude"]

[[agents.screen_rules]]
id = "claude.blocked.permission"
state = "blocked"
matcher = "substring"
pattern = "Do you want to"

[[agents.screen_rules]]
id = "claude.blocked.allow"
state = "blocked"
matcher = "substring"
pattern = "Allow this action?"

# The spinner glyph (✻) is NOT a working signal: Claude Code reuses it in the
# turn summary ("✻ Cogitated for 5m 10s · done 2:17 p.m."), which kept panes
# "working" forever. The interrupt hint only shows while a turn runs.
[[agents.screen_rules]]
id = "claude.working.interrupt"
state = "working"
matcher = "substring"
pattern = "esc to interrupt"

# Substring, not literal: the input box reads "❯ <draft>" while the user types.
[[agents.screen_rules]]
id = "claude.idle.composer"
state = "idle"
matcher = "substring"
pattern = "❯"

[[agents]]
kind = "codex"
process_name_patterns = ["codex"]
launch_command_hints = ["codex"]
osc_title_patterns = ["Codex"]

[[agents.screen_rules]]
id = "codex.blocked.trust"
state = "blocked"
matcher = "substring"
pattern = "Do you trust the contents of this directory?"

[[agents.screen_rules]]
id = "codex.blocked.update"
state = "blocked"
matcher = "substring"
pattern = "Update available. Install now?"

[[agents.screen_rules]]
id = "codex.working.interrupt"
state = "working"
matcher = "substring"
pattern = "Esc to interrupt"

[[agents.screen_rules]]
id = "codex.working.status"
state = "working"
matcher = "substring"
pattern = "• Working"

# Substring for the same reason as claude's: "› <draft>" is still idle.
[[agents.screen_rules]]
id = "codex.idle.composer"
state = "idle"
matcher = "substring"
pattern = "›"

