# starcil configuration
# Place this file at %APPDATA%\starcil\config.toml on Windows
# or ~/.config/starcil/config.toml on Linux and macOS.

# Show first-run notification setup on startup.
# Missing (the default) also shows onboarding; set false after you've chosen.
# onboarding = true

[theme]
# Built-in themes: starcil, catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# name = "starcil"

# Follow host terminal light/dark appearance and switch Starcil UI themes.
# Existing manual behavior is unchanged unless this is true.
# auto_switch = false
# dark_name = "catppuccin"       # optional; unset derives a matching dark sibling
# light_name = "catppuccin-latte" # optional; unset derives a matching light sibling

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# Reset aliases default, none, and transparent are also accepted.
# [theme.custom]
# panel_bg = "reset"
# accent = "#f5c2e7"
# brand = "#8B5CF6"       # platform brand purple: the command bar border
# surface0 = "#313244"
# surface1 = "#45475a"
# surface_dim = "#11111b"
# overlay0 = "#6c7086"
# overlay1 = "#7f849c"
# text = "#cdd6f4"
# subtext0 = "#a6adc8"
# mauve = "#cba6f7"
# red = "#ff6188"
# green = "#a6e3a1"
# yellow = "#f9e2af"
# blue = "#89b4fa"
# teal = "#94e2d5"
# peach = "#fab387"

[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL (then zsh/bash if present, then /bin/sh) on Unix, or
# PowerShell on Windows (pwsh.exe when on PATH, else powershell.exe; never cmd.exe).
# default_shell = ""

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
# shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Starcil's process directory, or a fixed path such as "~/Projects".
# new_cwd = "follow"

[update]
# Update channel used by background version checks and `starcil update`.
# Defaults to "stable" on Linux/macOS and "preview" on Windows.
# Set explicitly to choose stable releases or opt-in preview builds.
# channel = "stable"

# Check starcil.dev for new Starcil versions in the background.
# version_check = true

# Check starcil.dev for remote agent-detection manifest updates in the background.
# manifest_check = true

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# A binding may also be an array, for example next_tab = ["prefix+n", "ctrl+alt+n"].
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in starcil --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# copy_mode = "prefix+["
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# swap_pane_left = "prefix+shift+h"
# swap_pane_down = "prefix+shift+j"
# swap_pane_up = "prefix+shift+k"
# swap_pane_right = "prefix+shift+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Bottom command bar. focus_input toggles the keyboard between the input and
# the focused pane; open_folder opens the native OS folder picker (the visual
# cd, also on the command bar's folder button); dock_agent launches dock item
# N in a new pane (also clickable). Esc in an empty input hands the keyboard
# back to the pane; Ctrl+O inside the input opens the folder picker too.
# focus_input = "ctrl+space"
# open_folder = "prefix+f"
# dock_agent = "alt+1..9"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab,
# shift+tab, left/right arrows, or unmodified 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# type = "plugin_action" invokes an installed plugin action id.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# description = "run lazygit"
# width = "80%"
# height = "80%"

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.
# [keys.indexed]
# tabs = ""       # e.g. "ctrl" makes ctrl+1..9 switch tabs directly
# workspaces = "" # e.g. "ctrl+shift" makes ctrl+shift+1..9 switch workspaces directly
# agents = ""     # e.g. "alt" makes alt+1..9 focus agent rows directly

# [worktrees]
# directory = "~/.starcil/worktrees"

[ui]
# Sidebar width (auto-scaled based on workspace names, this sets the default)
# sidebar_width = 26

# Minimum sidebar width when expanded (columns)
# sidebar_min_width = 18

# Maximum sidebar width when expanded (columns)
# sidebar_max_width = 36

# Share of the sidebar height for the workspaces section (0.0-1.0). Drag the
# line above `agents` to change it; the TUI writes the value back here.
# sidebar_section_split = 0.5

# Start with the sidebar collapsed. Changes take effect on the next launch.
# sidebar_start_collapsed = false

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
# sidebar_collapsed_mode = "compact"

# Terminal width at or below which Starcil uses the mobile single-column layout.
# Increase this for foldables, tablets, or wide phone terminals.
# mobile_width_threshold = 64

# Capture mouse input for Starcil's mouse UI.
# Set false to let the terminal handle normal clicks, such as Cmd-clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# mouse_capture = true

# Automatically copy text selected by mouse drag.
# Set false to keep drag selection visible without copying; double-click still copies a word.
# copy_on_select = true

# Host cursor policy: "auto", "native", or "drawn".
# "auto" draws Starcil's own cursor on native Windows builds and WSL to avoid ConPTY cursor flicker, and uses the native terminal cursor elsewhere.
# "native" always uses the outer terminal cursor. "drawn" always draws Starcil's cursor as terminal cell content.
# host_cursor = "auto"

# Optional modifier combination that forwards right-click hold/drag gestures to pane apps instead of opening Starcil's pane menu.
# Accepts ctrl, alt, cmd, super/meta, hyper, and + combinations. Empty/off disables this.
# Shift is intentionally unsupported because terminals commonly reserve Shift+mouse.
# right_click_passthrough_modifier = ""

# Force a full redraw when the outer terminal regains focus.
# Set false to reduce visible flashing when switching back to Starcil.
# Trade-off: rare host terminal surface corruption may persist until the next full redraw.
# redraw_on_focus_gained = true

# Pane scrollback lines to scroll per mouse wheel notch.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a tab name before creating a new tab.
# Set false to create tabs immediately with generated names.
# prompt_new_tab_name = true

# Ask for a workspace name before interactive creation.
# prompt_new_workspace_name = false

# Draw borders around split panes.
# pane_borders = true

# Draw interactive scrollbars beside terminal panes.
# Disable to reclaim the scrollbar column and keep it out of terminal-native selections.
# pane_scrollbars = true

# Keep split panes visually separated instead of sharing divider borders.
# pane_gaps = false

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
# show_agent_labels_on_pane_borders = true

# Hide the tab row when a workspace has exactly one tab.
# New tabs can still be created with the configured keybinding.
# hide_tab_bar_when_single_tab = false

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# "workspaces" is accepted as an alias for "spaces".
# agent_panel_sort = "spaces"

# Desktop tab row position: "top" or "bottom".
# tab_bar_position = "top"

# Expanded agent rows. Built-ins are state_icon, state_text, workspace, tab, pane, agent, agent_kind,
# terminal_title, and terminal_title_stripped.
# Custom values reported through pane metadata use a $name token.
# A token occurrence may be styled with { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Omitted style fields preserve the contextual default.
# Layouts support at most 16 rows and 16 tokens per row.
# Agent dock: CLI binaries looked up on PATH and shown as clickable launchers
# above the bottom command input. Order here is the dock order.
# [ui.dock]
# agents = ["claude", "codex", "opencode", "aider", "gemini", "kimi", "deepseek"]

# [ui.sidebar.agents]
# Blank rows between agent entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["state_icon", "pane", "agent_kind"], ["state_text"]]
# Optional canonical agent IDs replace the default rows for matching agents.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# Expanded space rows. Built-ins are index, state_icon, state_text, workspace, branch, and git_status.
# Custom values reported through workspace metadata use a $name token, for example $jj_status.
# Inline token styles accept strict #RGB/#RRGGBB foregrounds plus bold and dim booleans.
# [ui.sidebar.spaces]
# Blank rows between space entries. Set to 1 to restore the previous spacing.
# row_gap = 0
# rows = [["index", "workspace", "state_icon"], ["branch", "git_status"]]

# [ui]
# Accent color for highlights, borders, and navigation UI.
# Accepts: hex (#4a9eff), named colors (cyan, blue, magenta), or rgb(r,g,b)
# accent = "#4a9eff"

# Background notification popup delivery
[ui.toast]
# off = disable pop-up notifications
# starcil = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
# delivery = "off"
# delay_seconds = 1

[ui.toast.starcil]
# Options: top-left, top-right, bottom-left, bottom-right.
# position = "bottom-right"

[ui.toast.clipboard]
# enabled = true
# position = "bottom-center"

# Play sounds when agents change state in background workspaces
[ui.sound]
# enabled = true
# Optional custom mp3/wav sound files. Relative paths resolve from this config file's directory.
# path = "sounds/notification.wav"   # one sound file for all sound notifications
# done_path = "sounds/done.wav"      # overrides only finished notifications
# request_path = "sounds/request.wav" # overrides only needs-attention notifications

# Per-agent overrides: default | on | off
# By default, droid is muted.
# [ui.sound.agents]
# pi = "default"
# claude = "default"
# codex = "default"
# gemini = "default"
# cursor = "default"
# devin = "default"
# agy = "default"
# cline = "default"
# open_code = "default"
# github_copilot = "default"
# kimi = "default"
# kiro = "default"
# droid = "off"
# amp = "default"
# grok = "default"
# hermes = "default"
# kilo = "default"
# qodercli = "default"
# maki = "default"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Starcil server restart. Requires official integrations that report session refs.
# resume_agents_on_restore = true

[remote]
# Whether Starcil manages the ssh config used for `starcil --remote`.
# When true (default), Starcil runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Starcil also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops Starcil from adding its own.
# manage_ssh_config = true

[experimental]
# Allow launching Starcil from inside a Starcil-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
# kitty_graphics = false
# Save recent pane screen history across full server restarts.
pane_history = false
# While prefix mode is active, temporarily switch the macOS/Windows host input
# source to an ASCII-capable keyboard layout so prefix commands register,
# then restore the previous input source when prefix mode exits. Best-effort.
# switch_ascii_input_source_in_prefix = false
# Expose the focused pane's cursor to the outer terminal so input methods keep
# tracking the candidate window when TUIs paint their own cursor.
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, devin, cline, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder, maki.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000
# Legacy alias: scrollback_lines
