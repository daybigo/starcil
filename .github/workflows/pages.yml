name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "packaging/install.ps1"
      - "packaging/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The site is static HTML; the installers are served from the same
      # origin so `irm https://<pages>/install.ps1 | iex` works.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/
          cp packaging/install.ps1 packaging/install.sh _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
